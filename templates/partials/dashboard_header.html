<header class="flex h-[68px] shrink-0 items-center justify-between border-b border-[#e5e5e5] bg-white px-4 md:px-6">
    <div class="flex min-w-0 items-center gap-4">
        <a class="grid h-9 w-9 place-items-center rounded-md text-[#424242] hover:bg-[#f2f2f2]" href="{% url 'home' %}" aria-label="SomaCloud home">
            <i data-lucide="cloud" class="h-5 w-5"></i>
        </a>
        <div>
            <p class="text-sm font-semibold text-black">SomaCloud</p>
            <p class="hidden text-xs text-[#5c5c5c] sm:block">{{ user_role_label|default:"Learning Platform" }}</p>
        </div>
    </div>

    <div class="mx-auto hidden w-full max-w-md px-4 lg:block">
        <div class="relative">
            <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-[#8a8a8a]"></i>
            <input id="global-user-search" class="h-9 w-full rounded-lg border border-[#c8c8c8] bg-[#f7f7f7] pl-10 pr-3 text-sm text-[#1f1f1f] outline-none transition-colors focus:border-[#0067c0] focus:bg-white focus:ring-2 focus:ring-[#b7d8ff]" type="text" placeholder="Search users, labs, sessions..." autocomplete="off" oninput="if(window.filterUsers)filterUsers(this.value)">
            <button onclick="var i=document.getElementById('global-user-search'); i.value=''; i.focus(); if(window.filterUsers)filterUsers('')" class="absolute right-2 top-1/2 hidden -translate-y-1/2 rounded p-0.5 text-[#8a8a8a] hover:bg-[#e5e5e5]" id="global-search-clear" type="button">
                <i data-lucide="x" class="h-3.5 w-3.5"></i>
            </button>
        </div>
    </div>

    <div class="flex items-center gap-3">
        {% if user_role_label == "Administrator" %}
            <a class="hidden items-center gap-2 rounded-full bg-[#eef3ff] px-4 py-2 text-sm font-medium text-[#424242] hover:bg-[#e3ecff] lg:flex" href="{% url 'control_panel' %}">
                <i data-lucide="shield" class="h-5 w-5 text-[#0067c0]"></i>
                Administration
            </a>
        {% endif %}
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button class="grid h-9 w-9 place-items-center rounded-full text-[#424242] hover:bg-[#f2f2f2]" aria-label="Logout" type="submit">
                <i data-lucide="log-out" class="h-5 w-5"></i>
            </button>
        </form>
        <div class="grid h-9 w-9 place-items-center overflow-hidden rounded-full border border-[#d6d6d6] bg-[#111827] text-xs font-semibold text-white">
            {{ request.user.username|slice:":2"|upper }}
        </div>
    </div>
</header>
