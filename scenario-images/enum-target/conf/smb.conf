[global]
   workgroup = WORKGROUP
   server string = Globex File Server
   netbios name = GLOBEX
   security = user
   map to guest = Bad User
   guest account = nobody
   passdb backend = smbpasswd
   smb passwd file = /var/lib/samba/private/smbpasswd
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /dev/stdout
   log level = 1
   smb ports = 139 445

[public]
   comment = Globex public documents
   path = /srv/smb/public
   browseable = yes
   read only = yes
   guest ok = yes
   force user = nobody

[IT-Department]
   comment = IT department archives (restricted)
   path = /srv/smb/it
   browseable = yes
   read only = yes
   guest ok = no
   valid users = globex

[backup]
   comment = Legacy backup shares
   path = /srv/smb/backup
   browseable = yes
   read only = yes
   guest ok = yes
   force user = nobody