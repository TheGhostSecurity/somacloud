# Globex SNMP appliance - enumeration lab
sysdescr   Globex Enumeration Appliance v2.7.1
syscontact operators@globex.local
syslocation Globex HQ - Rack 04

rocommunity public  0.0.0.0/0
rocommunity globex  0.0.0.0/0

view systemview  included .1.3.6.1.2.1.1
view systemview  included .1.3.6.1.2.1.25.1
view globexview  included .1

group systemGroup v1  public
group systemGroup v2c public
group globexGroup v1  globex
group globexGroup v2c globex

access systemGroup "" any noauth exact systemview none none
access globexGroup  "" any noauth exact globexview  none none

extend app   /bin/cat /srv/www/version.txt
extend build /bin/cat /etc/globex-build