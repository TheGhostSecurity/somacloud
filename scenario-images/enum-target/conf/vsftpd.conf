# Globex FTP drop - anonymous read-only (enumeration lab)
listen=YES
listen_port=21
anonymous_enable=YES
local_enable=NO
write_enable=NO
anon_world_readable_only=YES
anon_root=/srv/ftp
dirmessage_enable=YES
xferlog_enable=YES
xferlog_file=/dev/stdout
syslog_enable=NO
# Keep banners fingerprintable
ftpd_banner=Globex FTP File Drop (vsftpd 3.0.5)
seccomp_sandbox=NO