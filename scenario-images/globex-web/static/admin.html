<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login — Globex Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="grid min-h-screen place-items-center bg-slate-100 px-4 text-slate-800">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <span class="mx-auto grid h-12 w-12 place-items-center rounded-xl bg-indigo-600 text-xl font-black text-white">G</span>
      <h1 class="mt-3 text-xl font-bold">Globex Admin</h1>
      <p class="mt-1 text-sm text-slate-500">Staff sign in</p>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-lg">
      <form class="space-y-4">
        <div>
          <label class="text-sm font-semibold">Username</label>
          <input class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Staff username">
        </div>
        <div>
          <label class="text-sm font-semibold">Password</label>
          <input type="password" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="••••••••">
        </div>
        <button class="w-full rounded-lg bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700" type="submit">Sign in</button>
      </form>
      <p class="mt-4 text-center text-xs text-slate-400">Protected area — authorized staff only.</p>
    </div>
  </div>
</body>
</html>
